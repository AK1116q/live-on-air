<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Local Bilibili and Douyu live stream alerts"
    />
    <title>Live On Air</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <div class="app-frame">
        <header class="app-header">
          <div>
            <span class="eyebrow">直播监控</span>
            <h1>开播提醒</h1>
          </div>
          <button id="check" class="secondary">立即检查</button>
        </header>
        <div class="scroll-shell">
          <section class="panel">
            <form id="add">
              <label class="wide">
                平台
                <div
                  class="platform-picker"
                  role="radiogroup"
                  aria-label="平台"
                >
                  <input
                    id="platform-bilibili"
                    class="platform-radio"
                    type="radio"
                    name="platform"
                    value="bilibili"
                    checked
                  />
                  <label
                    class="platform-option"
                    data-platform="bilibili"
                    for="platform-bilibili"
                  >
                    哔哩哔哩
                  </label>
                  <input
                    id="platform-douyu"
                    class="platform-radio"
                    type="radio"
                    name="platform"
                    value="douyu"
                  />
                  <label
                    class="platform-option"
                    data-platform="douyu"
                    for="platform-douyu"
                  >
                    斗鱼
                  </label>
                </div>
              </label>
              <label class="wide">
                房间链接或 ID
                <input id="room" placeholder="https://live.bilibili.com/6" />
              </label>
              <label class="wide">
                显示名称
                <input
                  id="label"
                  placeholder="可选，例如：喜欢的主播"
                  maxlength="80"
                />
              </label>
              <button>添加房间</button>
            </form>
          </section>
          <section class="settings panel">
            <label>
              检查间隔，分钟
              <input id="interval" type="number" min="1" max="120" step="1" />
            </label>
            <label class="check">
              <input id="desktop" type="checkbox" />
              桌面提醒
            </label>
            <label class="check">
              <input id="phone" type="checkbox" />
              手机提醒，通过 ntfy
            </label>
            <label class="wide">
              ntfy 主题
              <input id="topic" placeholder="例如 ak-live-alerts" />
            </label>
            <button id="save" type="button">保存设置</button>
            <button id="test-phone" type="button" class="secondary">
              测试手机
            </button>
          </section>
          <p id="status" role="status" aria-live="polite"></p>
          <section id="list" class="rooms"></section>
          <footer>本地桌面提醒。手机提醒可选，需要使用 ntfy.sh。</footer>
        </div>
      </div>
    </main>
    <script src="core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
